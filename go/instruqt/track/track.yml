title: Temporal Half-Day Workshop - Go
teaser: Nine short Go pages. Retries, Signals, Queries, a durable timer, an Update
  and tests that skip time.
description: |-
  A hands-on Temporal workshop in Go, in nine short pages. Each page adds one
  idea, shows you the code, and puts it in the editor with one click. Then
  you run it, watch what happens, and try one change of your own.

  Start with a greeting that only arrives because Temporal retried a flaky
  Activity. Then build a money transfer that waits for a person to approve
  it, answers questions about its state, and gives up after a deadline even
  while no Worker is running. Finish by making a bad account number park
  the transfer until someone fixes it with an Update, and prove it all with
  tests that skip time.
