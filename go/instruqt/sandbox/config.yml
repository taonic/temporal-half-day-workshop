name: Temporal Half-Day Workshop Sandbox - Go
slug: temporal-half-day-sandbox-go
description: |-
  Go 1.24 sandbox for the Temporal Half-Day Workshop (Go) track.

  scripts/setup-workshop installs git, Go, the Temporal CLI and code-server,
  clones the workshop repo, warms the Go module and build caches, and starts
  the Temporal dev server and code-server.

  Pushed and published independently of the track:
    instruqt sandbox push
    instruqt sandbox publish --message="..."
containers:
- name: workshop
  image: ubuntu:24.04
  shell: /bin/bash
  memory: 4096
  # Every port a challenge tab points at. Instruqt's proxy returns HTTP 572
  # (target host connection failed) for ports that are not listed here.
  ports:
  - 8233   # Temporal Web UI
  - 8080   # code-server, the Code Editor tab
